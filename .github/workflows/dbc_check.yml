name: DBC Lint

on:
  push:
    paths:
      - '**.dbc'
      - '.github/scripts/dbc_lint.py'
      - '.github/workflows/dbc-lint.yml'
  pull_request:
    paths:
      - '**.dbc'
      - '.github/scripts/dbc_lint.py'
      - '.github/workflows/dbc-lint.yml'

jobs:
  lint:
    name: Validate DBC files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DBC linter
        run: |
          python .github/scripts/dbc_lint.py **/*.dbc --github-annotations

      - name: Generate summary
        if: always()
        run: |
          python .github/scripts/dbc_lint.py **/*.dbc 2>&1 | tee full_summary.txt || true

          echo "## DBC Lint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat full_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbc-lint-report
          path: full_summary.txt
